{% extends 'base.html' %}{% block content %}<section class='panel narrow'><h1>Create encrypted vault</h1><p>Use a unique master password with at least 14 characters. It cannot be recovered by the developer.</p><form method='post'><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Master password <input type='password' name='master_password' minlength='14' autocomplete='new-password' required></label><label>Confirm password <input type='password' name='confirm' minlength='14' autocomplete='new-password' required></label><button>Create vault</button></form></section>{% endblock %}
