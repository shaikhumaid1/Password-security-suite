{% extends "base.html" %}{% block title %}Initial setup{% endblock %}
{% block content %}
<section class="panel narrow">
  <p class="eyebrow">FIRST-TIME CONFIGURATION</p><h1>Create your local account</h1>
  <p class="muted">Choose a unique master password. MFA enrollment is required immediately after setup.</p>
  <form method="post" class="stack">
    <label>Username<input name="username" minlength="3" required autocomplete="username"></label>
    <label>Master password<input type="password" name="password" minlength="12" required autocomplete="new-password"></label>
    <label>Confirm master password<input type="password" name="confirm" minlength="12" required autocomplete="new-password"></label>
    <button type="submit">Create account</button>
  </form>
</section>
{% endblock %}
