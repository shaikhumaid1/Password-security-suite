<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='csrf-token' content='{{ csrf_token() }}'><title>Password Security Suite</title><link rel='stylesheet' href='{{ url_for("static",filename="style.css") }}'></head><body><header class='topbar'><a class='brand' href='{{ url_for("home") }}'>PSS<span>.</span></a><nav><a href='{{ url_for("home") }}'>Home</a><a href='{{ url_for("toolkit") }}'>Toolkit</a><a href='{{ url_for("vault_page") }}'>Vault</a></nav></header><main class='container'>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class='flash {{ category }}'>{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>Local-first · Your data stays on your device</footer>{% if session.get('vault_unlocked') %}<script>
(() => {
 const timeoutMs = 5 * 60 * 1000;
 let idleTimer;
 const lockNow = () => {
  const token = document.querySelector('meta[name="csrf-token"]')?.content;
  const body = new URLSearchParams();
  if (token) body.set('csrf_token', token);
  fetch('{{ url_for("lock_vault") }}', {
   method: 'POST',
   credentials: 'same-origin',
   headers: {'Content-Type': 'application/x-www-form-urlencoded'},
   body: body.toString()
  }).finally(() => { window.location.href = '{{ url_for("home") }}'; });
 };
 const resetTimer = () => {
  window.clearTimeout(idleTimer);
  idleTimer = window.setTimeout(lockNow, timeoutMs);
 };
 ['mousemove','mousedown','keydown','scroll','touchstart'].forEach(eventName => {
  window.addEventListener(eventName, resetTimer, {passive:true});
 });
 resetTimer();
})();
</script>{% endif %}</body></html>
